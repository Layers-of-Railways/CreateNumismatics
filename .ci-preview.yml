minecraft_version: 1.21.1
workflows: [".github/workflows/build.yml"]
mod_version:
  path: gradle.properties
  regex: mod_version = (.*)
  group: 1
  format: ${mod_version}+mc${minecraft_version}-build.${build_number}
buttons:
  fabric:
    style: link
    url: https://maven.ithundxr.dev/snapshots/dev/ithundxr/createnumismatics/CreateNumismatics-fabric-${minecraft_version}/${mod_version}+fabric-mc${minecraft_version}-build.${build_number}/CreateNumismatics-fabric-${minecraft_version}-${mod_version}+fabric-mc${minecraft_version}-build.${build_number}.jar
    label: ~~Fabric~~ (Disabled)
  neoforge:
    style: link
    url: https://maven.ithundxr.dev/snapshots/dev/ithundxr/createnumismatics/CreateNumismatics-neoforge-${minecraft_version}/${mod_version}+neoforge-mc${minecraft_version}-build.${build_number}/CreateNumismatics-neoforge-${minecraft_version}-${mod_version}+neoforge-mc${minecraft_version}-build.${build_number}.jar
    label: NeoForge
